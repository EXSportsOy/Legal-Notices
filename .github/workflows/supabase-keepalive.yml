# Lisää Supabasen ilmaistason feedback-projektin tietokanta-aktiivisuutta.
# Supabase voi pausata projektin, jos viikon aikana on liian vähän kyselyjä.
# Muutama kysely päivässä yleensä riittää; Free-tasolla tästä ei ole takuuta.
# URL ja anon-avain ovat samat julkiset arvot kuin feedback/feedback-config.js:ssä,
# joten niitä ei tarvitse piilottaa secretteihin.

name: Supabase keepalive

on:
  schedule:
    # päivittäin klo 00:17, 06:17, 12:17 ja 18:17 UTC
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        run: |
          if ! status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            --retry 3 --retry-delay 5 --retry-max-time 120 --retry-connrefused \
            -H "apikey: sb_publishable_oLj_DP6MSemsDIX4fgpeSw_VBma2Ay2" \
            "https://jaepadyeyrrwhiomxyfj.supabase.co/rest/v1/feedback?select=id&limit=1"); then
            echo "Keepalive-yhteys epäonnistui uudelleenyritysten jälkeen." >&2
            exit 1
          fi
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Keepalive-ping epäonnistui, projekti voi olla pausattuna." >&2
            exit 1
          fi
